# Render blueprint for the BudgetPlate backend + database.
# Deploy with: Render dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: budgetplate-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard (secret)
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      # The weekly refresh runs in GitHub Actions; a free web service sleeps
      # after 15 idle minutes, so an in-process scheduler can't be trusted.
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: budgetplate-db
          property: connectionString

databases:
  - name: budgetplate-db
    plan: free
